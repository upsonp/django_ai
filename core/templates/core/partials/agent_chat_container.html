{% partialdef chat-items %}
    <hx-partial hx-target="#div_id_chat_messages" hx-swap="beforeend scroll:bottom">
        <div class="chat-container">
            <p>{{ chat_message }}</p>
            <p>=====================</p>
        </div>
    </hx-partial>
    <hx-partial hx-target="#div_id_thinking_messages" hx-swap="beforeend scroll:bottom">
        <div class="chat-container">
            <p>{{ chat_thought }}</p>
            <p>=====================</p>
        </div>
    </hx-partial>
{% endpartialdef %}

<div id="div_id_agent_chat_container" class="mt-2">
    {# Replace the two overflow divs with this tabbed UI #}
    <ul class="nav nav-tabs mt-2" id="chatTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="chat-tab" data-bs-toggle="tab" data-bs-target="#chat-pane"
                    type="button" role="tab" aria-controls="chat-pane" aria-selected="true">
                Response
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="thinking-tab" data-bs-toggle="tab" data-bs-target="#thinking-pane"
                    type="button" role="tab" aria-controls="thinking-pane" aria-selected="false">
                Thinking
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="chat-pane" role="tabpanel" aria-labelledby="chat-tab">
            <div class="card">
                <div class="card-body">
                    <div class="overflow-auto" style="height: 400px;" id="div_id_chat_messages">
                        {# HTMX partials will append content here #}
                    </div>

                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="thinking-pane" role="tabpanel" aria-labelledby="thinking-tab">
            <div class="card">
                <div class="card-body">
                    <div class="overflow-auto" style="height: 400px;" id="div_id_thinking_messages">
                        {# Thinking partials will appear here #}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
